<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="A programmer seen from behind, coding at a desk with three glowing monitors in a dark room">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2229"/>
      <stop offset="1" stop-color="#040d10"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#2aa197" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#2aa197" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2aa197" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d343a"/>
      <stop offset="1" stop-color="#08232a"/>
    </linearGradient>
    <linearGradient id="screenSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082027"/>
      <stop offset="1" stop-color="#0c3036"/>
    </linearGradient>
    <linearGradient id="screenSideR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#082027"/>
      <stop offset="1" stop-color="#0c3036"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16343a"/>
      <stop offset="1" stop-color="#0a171b"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132327"/>
      <stop offset="1" stop-color="#070f11"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16262a"/>
      <stop offset="1" stop-color="#0a1315"/>
    </linearGradient>
    <!-- rim light: bright on top edges (facing the screens), fading downward -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe3d6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#2aa197" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2aa197" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mainScreen"><rect x="200" y="78" width="240" height="140" rx="3"/></clipPath>
    <style>
      .float { animation: float 7s ease-in-out infinite; }
      .float.d2 { animation-delay: -2.3s; animation-duration: 8.5s; }
      .float.d3 { animation-delay: -4.6s; animation-duration: 9.5s; }
      .type { transform-box: fill-box; transform-origin: left center; animation: type 3.6s steps(18) infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .steam { animation: steam 4.5s ease-in-out infinite; opacity: 0; }
      .steam.d2 { animation-delay: -2.2s; }
      .breathe { transform-box: fill-box; transform-origin: center bottom; animation: breathe 5.5s ease-in-out infinite; }
      .glowpulse { animation: glowpulse 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes type { 0% { transform: scaleX(0); } 70%,100% { transform: scaleX(1); } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
      @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-22px); } }
      @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
      @keyframes glowpulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .float, .type, .caret, .steam, .breathe, .glowpulse { animation: none; }
        .steam { opacity: .35; }
      }
    </style>
  </defs>

  <!-- room -->
  <rect width="640" height="520" fill="url(#wall)"/>
  <ellipse class="glowpulse" cx="320" cy="170" rx="330" ry="220" fill="url(#spill)"/>

  <!-- floating code glyphs (depth: smaller = farther) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3fd1c1">
    <text class="float" x="70" y="58" font-size="15" opacity=".35">&lt;/&gt;</text>
    <text class="float d2" x="520" y="52" font-size="13" opacity=".3">func()</text>
    <text class="float d3" x="40" y="250" font-size="12" opacity=".22">{ }</text>
    <text class="float d2" x="560" y="246" font-size="12" opacity=".22">C++</text>
    <text class="float" x="300" y="40" font-size="11" opacity=".22">go run .</text>
  </g>

  <!-- ===== left monitor (angled toward viewer) ===== -->
  <polygon points="58,96 184,82 184,224 58,214" fill="#0b1316" stroke="#1d3238" stroke-width="1.5"/>
  <polygon points="65,103 177,90 177,216 65,207" fill="url(#screenSide)"/>
  <g stroke-linecap="round" stroke-width="3.2">
    <line x1="74" y1="114" x2="96" y2="112" stroke="#3fd1c1"/>
    <line x1="100" y1="112" x2="150" y2="107" stroke="#d9e4dc" stroke-opacity=".55"/>
    <line x1="74" y1="128" x2="132" y2="122" stroke="#d9e4dc" stroke-opacity=".35"/>
    <line x1="74" y1="142" x2="88" y2="141" stroke="#3fd1c1"/>
    <line x1="92" y1="140" x2="160" y2="134" stroke="#e7c27d" stroke-opacity=".75"/>
    <line x1="74" y1="156" x2="118" y2="152" stroke="#d9e4dc" stroke-opacity=".35"/>
    <line x1="74" y1="170" x2="88" y2="169" stroke="#3fd1c1"/>
    <line x1="92" y1="168" x2="140" y2="164" stroke="#7fe3a8" stroke-opacity=".8"/>
    <line x1="74" y1="184" x2="106" y2="181" stroke="#d9e4dc" stroke-opacity=".3"/>
  </g>

  <!-- ===== right monitor (angled toward viewer) ===== -->
  <polygon points="456,82 582,96 582,214 456,224" fill="#0b1316" stroke="#1d3238" stroke-width="1.5"/>
  <polygon points="463,90 575,103 575,207 463,216" fill="url(#screenSideR)"/>
  <!-- tiny metrics chart -->
  <polyline points="474,190 492,176 508,182 524,160 540,166 556,140 566,146" fill="none" stroke="#3fd1c1" stroke-width="2.2" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#2aa197" opacity=".45">
    <rect x="474" y="196" width="8" height="10"/>
    <rect x="488" y="192" width="8" height="14"/>
    <rect x="502" y="198" width="8" height="8"/>
    <rect x="516" y="188" width="8" height="18"/>
    <rect x="530" y="194" width="8" height="12"/>
    <rect x="544" y="185" width="8" height="21"/>
  </g>
  <g stroke-linecap="round" stroke-width="3">
    <line x1="474" y1="112" x2="520" y2="116" stroke="#d9e4dc" stroke-opacity=".5"/>
    <line x1="474" y1="124" x2="500" y2="127" stroke="#e7c27d" stroke-opacity=".6"/>
  </g>

  <!-- ===== main monitor ===== -->
  <rect x="190" y="68" width="260" height="160" rx="8" fill="#0b1316" stroke="#1f3a40" stroke-width="1.5"/>
  <rect x="200" y="78" width="240" height="140" rx="3" fill="url(#screen)"/>
  <g clip-path="url(#mainScreen)" stroke-linecap="round" stroke-width="3.4">
    <!-- line numbers -->
    <g fill="#5d7a7a" opacity=".5">
      <rect x="208" y="90" width="6" height="3"/><rect x="208" y="102" width="6" height="3"/>
      <rect x="208" y="114" width="6" height="3"/><rect x="208" y="126" width="6" height="3"/>
      <rect x="208" y="138" width="6" height="3"/><rect x="208" y="150" width="6" height="3"/>
      <rect x="208" y="162" width="6" height="3"/><rect x="208" y="174" width="6" height="3"/>
      <rect x="208" y="186" width="6" height="3"/><rect x="208" y="198" width="6" height="3"/>
    </g>
    <line x1="224" y1="92" x2="246" y2="92" stroke="#3fd1c1"/>
    <line x1="252" y1="92" x2="300" y2="92" stroke="#d9e4dc" stroke-opacity=".75"/>
    <line x1="306" y1="92" x2="318" y2="92" stroke="#5d7a7a"/>

    <line x1="236" y1="104" x2="262" y2="104" stroke="#3fd1c1"/>
    <line x1="268" y1="104" x2="330" y2="104" stroke="#e7c27d" stroke-opacity=".85"/>

    <line x1="236" y1="116" x2="256" y2="116" stroke="#c39cf2" stroke-opacity=".8"/>
    <line x1="262" y1="116" x2="350" y2="116" stroke="#d9e4dc" stroke-opacity=".6"/>

    <line x1="248" y1="128" x2="268" y2="128" stroke="#3fd1c1"/>
    <line x1="274" y1="128" x2="312" y2="128" stroke="#d9e4dc" stroke-opacity=".6"/>
    <line x1="318" y1="128" x2="370" y2="128" stroke="#e7c27d" stroke-opacity=".8"/>

    <line x1="248" y1="140" x2="300" y2="140" stroke="#5d7a7a" stroke-opacity=".9"/>

    <line x1="248" y1="152" x2="262" y2="152" stroke="#3fd1c1"/>
    <line x1="268" y1="152" x2="340" y2="152" stroke="#d9e4dc" stroke-opacity=".6"/>

    <line x1="236" y1="164" x2="250" y2="164" stroke="#d9e4dc" stroke-opacity=".5"/>

    <line x1="236" y1="176" x2="270" y2="176" stroke="#c39cf2" stroke-opacity=".8"/>
    <line x1="276" y1="176" x2="322" y2="176" stroke="#7fe3a8" stroke-opacity=".8"/>

    <line x1="224" y1="188" x2="236" y2="188" stroke="#d9e4dc" stroke-opacity=".5"/>

    <!-- the line being typed -->
    <g class="type">
      <line x1="224" y1="200" x2="250" y2="200" stroke="#3fd1c1"/>
      <line x1="256" y1="200" x2="318" y2="200" stroke="#d9e4dc" stroke-opacity=".75"/>
    </g>
    <rect class="caret" x="322" y="195" width="2.5" height="10" fill="#6fe3d6"/>
  </g>
  <!-- stand -->
  <rect x="309" y="228" width="22" height="34" fill="#0b1417"/>
  <ellipse cx="320" cy="263" rx="48" ry="6" fill="#0e1b1f"/>

  <!-- ===== desk (perspective) ===== -->
  <polygon points="40,262 600,262 640,322 0,322" fill="url(#desk)"/>
  <ellipse cx="320" cy="270" rx="250" ry="22" fill="#2aa197" opacity=".16" filter="url(#soft)"/>
  <rect x="0" y="322" width="640" height="12" fill="#081215"/>
  <line x1="40" y1="262" x2="600" y2="262" stroke="#2f6a6f" stroke-opacity=".5"/>

  <!-- keyboard + mouse -->
  <polygon points="236,280 404,280 414,298 226,298" fill="#0c171a" stroke="#2aa197" stroke-opacity=".35"/>
  <ellipse cx="450" cy="292" rx="10" ry="6" fill="#0c171a" stroke="#2aa197" stroke-opacity=".35"/>

  <!-- coffee mug -->
  <g>
    <path class="steam" d="M150 236 c-6 -8 6 -12 0 -22" fill="none" stroke="#d9e4dc" stroke-width="2" stroke-linecap="round"/>
    <path class="steam d2" d="M160 238 c-6 -8 6 -12 0 -22" fill="none" stroke="#d9e4dc" stroke-width="2" stroke-linecap="round"/>
    <rect x="142" y="244" width="26" height="28" rx="4" fill="#d9e4dc" opacity=".88"/>
    <path d="M168 251 h5 a6 6 0 0 1 0 12 h-5" fill="none" stroke="#d9e4dc" stroke-opacity=".88" stroke-width="3"/>
    <rect x="142" y="244" width="26" height="5" rx="2" fill="#2aa197" opacity=".6"/>
  </g>

  <!-- ===== the programmer, seen from behind ===== -->
  <g class="breathe">
    <!-- forearms reaching to the keyboard -->
    <path d="M246 352 C 238 330, 244 306, 262 292 L 282 296 C 268 310, 266 330, 274 352 Z" fill="#0d1a1d"/>
    <path d="M394 352 C 402 330, 396 306, 378 292 L 358 296 C 372 310, 374 330, 366 352 Z" fill="#0d1a1d"/>
    <ellipse cx="272" cy="292" rx="11" ry="6" fill="#1c2a2c"/>
    <ellipse cx="368" cy="292" rx="11" ry="6" fill="#1c2a2c"/>

    <!-- torso / hoodie -->
    <path d="M222 440 C 220 372, 232 330, 268 314 C 284 307, 298 303, 306 301 L 334 301 C 342 303, 356 307, 372 314 C 408 330, 420 372, 418 440 Z" fill="url(#hoodie)"/>
    <path d="M222 440 C 220 372, 232 330, 268 314 C 284 307, 298 303, 306 301 L 334 301 C 342 303, 356 307, 372 314 C 408 330, 420 372, 418 440" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <!-- spine fold -->
    <path d="M320 334 C 318 370, 322 400, 320 440" fill="none" stroke="#050b0c" stroke-width="2" opacity=".6"/>

    <!-- neck -->
    <rect x="308" y="274" width="24" height="30" rx="6" fill="#18252a"/>

    <!-- head (back of head: hair only, no face) -->
    <ellipse cx="320" cy="242" rx="37" ry="41" fill="url(#hair)"/>
    <ellipse cx="320" cy="242" rx="37" ry="41" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <g stroke="#223338" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M298 218 C 307 230, 309 250, 304 272"/>
      <path d="M320 206 C 324 226, 324 252, 320 278"/>
      <path d="M342 218 C 334 232, 331 250, 336 272"/>
    </g>

    <!-- headphones -->
    <path d="M281 246 C 278 184, 362 184, 359 246" fill="none" stroke="#15262a" stroke-width="7" stroke-linecap="round"/>
    <path d="M281 246 C 278 184, 362 184, 359 246" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    <rect x="271" y="232" width="17" height="32" rx="8" fill="#102024" stroke="#2aa197" stroke-opacity=".7"/>
    <rect x="352" y="232" width="17" height="32" rx="8" fill="#102024" stroke="#2aa197" stroke-opacity=".7"/>
    <circle cx="279.5" cy="248" r="2" fill="#6fe3d6" filter="url(#glow)"/>
  </g>

  <!-- chair back (closest to camera) -->
  <rect x="252" y="388" width="136" height="132" rx="26" fill="#071012"/>
  <rect x="252" y="388" width="136" height="132" rx="26" fill="none" stroke="url(#rim)" stroke-width="1.6" stroke-opacity=".7"/>
  <rect x="268" y="404" width="104" height="100" rx="18" fill="none" stroke="#132226" stroke-width="2"/>

  <!-- vignette -->
  <rect width="640" height="520" fill="url(#vignette)"/>
</svg>
